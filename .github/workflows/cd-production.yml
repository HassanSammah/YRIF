name: CD – Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # NEVER cancel an in-flight production deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Build & push images ────────────────────────────────────────────────────
  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: ci
    environment: production   # manual approval gate configured in GitHub Settings

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Backend image metadata
        id: be-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yrif-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.be-meta.outputs.tags }}
          labels: ${{ steps.be-meta.outputs.labels }}
          build-args: |
            SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Frontend image metadata
        id: fe-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yrif-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.fe-meta.outputs.tags }}
          labels: ${{ steps.fe-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy via SSH ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_BRIQ_API_KEY: ${{ secrets.PROD_BRIQ_API_KEY }}
          PROD_BRIQ_APP_KEY: ${{ secrets.PROD_BRIQ_APP_KEY }}
          PROD_BRIQ_WEBHOOK_SECRET: ${{ secrets.PROD_BRIQ_WEBHOOK_SECRET }}
          PROD_BRIQ_SMS_SENDER: ${{ secrets.PROD_BRIQ_SMS_SENDER }}
          PROD_BREVO_API_KEY: ${{ secrets.PROD_BREVO_API_KEY }}
          PROD_ANTHROPIC_API_KEY: ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          PROD_GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_ALLOWED_HOSTS: ${{ secrets.PROD_ALLOWED_HOSTS }}
          PROD_CORS_ALLOWED_ORIGINS: ${{ secrets.PROD_CORS_ALLOWED_ORIGINS }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          envs: PROD_SECRET_KEY,PROD_DB_NAME,PROD_DB_USER,PROD_DB_PASSWORD,PROD_BRIQ_API_KEY,PROD_BRIQ_APP_KEY,PROD_BRIQ_WEBHOOK_SECRET,PROD_BRIQ_SMS_SENDER,PROD_BREVO_API_KEY,PROD_ANTHROPIC_API_KEY,PROD_GOOGLE_CLIENT_ID,PROD_SUPABASE_URL,PROD_SUPABASE_ANON_KEY,PROD_ALLOWED_HOSTS,PROD_CORS_ALLOWED_ORIGINS,PROD_API_BASE_URL,GHCR_PULL_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            cd /var/www/yrif

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "--- Logging in to GHCR ---"
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            echo "--- Syncing env files ---"
            _uenv() {
              local k="$1" v="$2" f="$3"
              touch "$f"
              if grep -q "^${k}=" "$f" 2>/dev/null; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$f"
              else
                echo "${k}=${v}" >> "$f"
              fi
            }

            BE="backend/.env.production"
            ROOT=".env"
            _uenv SECRET_KEY           "$PROD_SECRET_KEY" "$BE"
            _uenv DB_NAME              "$PROD_DB_NAME" "$BE"
            _uenv DB_USER              "$PROD_DB_USER" "$BE"
            _uenv DB_PASSWORD          "$PROD_DB_PASSWORD" "$BE"
            _uenv DB_HOST              "db" "$BE"
            _uenv DB_PORT              "5432" "$BE"
            _uenv REDIS_URL            "redis://redis:6379/0" "$BE"
            _uenv BRIQ_API_KEY         "$PROD_BRIQ_API_KEY" "$BE"
            _uenv BRIQ_APP_KEY         "$PROD_BRIQ_APP_KEY" "$BE"
            _uenv BRIQ_WEBHOOK_SECRET  "${PROD_BRIQ_WEBHOOK_SECRET:-}" "$BE"
            _uenv BRIQ_SMS_SENDER      "${PROD_BRIQ_SMS_SENDER:-YRIF}" "$BE"
            _uenv BREVO_API_KEY        "$PROD_BREVO_API_KEY" "$BE"
            _uenv ANTHROPIC_API_KEY    "$PROD_ANTHROPIC_API_KEY" "$BE"
            _uenv GOOGLE_CLIENT_ID     "$PROD_GOOGLE_CLIENT_ID" "$BE"
            _uenv SUPABASE_URL         "$PROD_SUPABASE_URL" "$BE"
            _uenv SUPABASE_KEY         "$PROD_SUPABASE_ANON_KEY" "$BE"
            _uenv ALLOWED_HOSTS        "$PROD_ALLOWED_HOSTS" "$BE"
            _uenv CORS_ALLOWED_ORIGINS "$PROD_CORS_ALLOWED_ORIGINS" "$BE"
            _uenv DEFAULT_FROM_EMAIL   "noreply@yriftz.org" "$BE"
            _uenv CONTACT_EMAIL        "info@yriftz.org" "$BE"

            # Compose interpolates these from the project .env
            _uenv DB_NAME                  "$PROD_DB_NAME" "$ROOT"
            _uenv DB_USER                  "$PROD_DB_USER" "$ROOT"
            _uenv DB_PASSWORD              "$PROD_DB_PASSWORD" "$ROOT"
            _uenv VITE_SUPABASE_URL        "$PROD_SUPABASE_URL" "$ROOT"
            _uenv VITE_SUPABASE_ANON_KEY   "$PROD_SUPABASE_ANON_KEY" "$ROOT"
            _uenv VITE_GOOGLE_CLIENT_ID    "$PROD_GOOGLE_CLIENT_ID" "$ROOT"

            echo "--- Pulling latest code ---"
            git pull origin main
            echo "--- Pulling new Docker images ---"
            docker compose -f docker-compose.prod.yml pull
            echo "--- Restarting containers ---"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "--- Waiting for Gunicorn ---"
            for i in $(seq 1 24); do
              if docker exec yrif-backend-1 python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()" 2>/dev/null; then
                echo "Gunicorn is listening"
                break
              fi
              echo "Waiting for Gunicorn ($i/24)..."
              sleep 5
            done
            echo "--- Running migrations ---"
            docker exec yrif-backend-1 python manage.py migrate --no-input
            echo "--- Deploy complete ---"

      - name: Health check (production)
        run: |
          echo "Waiting 30s for deployment to settle..."
          sleep 30
          for i in 1 2 3 4 5; do
            BODY=$(curl -sSL --max-time 20 "https://yriftz.org/health/" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"database": "ok"' && echo "$BODY" | grep -q '"cache": "ok"'; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production health check failed after 5 attempts."
          exit 1

      - name: Notify on success
        if: success()
        run: echo "Production deploy succeeded for ${{ github.sha }} by ${{ github.actor }}"

      - name: Notify on failure
        if: failure()
        run: echo "::error::PRODUCTION deploy FAILED for ${{ github.sha }} by ${{ github.actor }}"
