name: CD – Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true   # cancel any in-flight staging deploy when a new one starts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Build & push images ────────────────────────────────────────────────────
  build:
    name: Build & push Docker images
    runs-on: ubuntu-24.04
    needs: ci
    environment: staging

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Backend image metadata
        id: be-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yrif-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.be-meta.outputs.tags }}
          labels: ${{ steps.be-meta.outputs.labels }}
          build-args: |
            SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Frontend image metadata
        id: fe-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yrif-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.fe-meta.outputs.tags }}
          labels: ${{ steps.fe-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.STAGING_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy via SSH ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: build
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check staging SSH config
        id: check
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          API_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          if [[ -n "$SSH_HOST" && -n "$SSH_KEY" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_SSH_HOST or STAGING_SSH_KEY not set — skipping deploy. Images were pushed to GHCR."
          fi
          echo "healthcheck=$([[ -n "$SSH_HOST" && -n "$API_URL" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.check.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1
        env:
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_BRIQ_API_KEY: ${{ secrets.STAGING_BRIQ_API_KEY }}
          STAGING_BRIQ_APP_KEY: ${{ secrets.STAGING_BRIQ_APP_KEY }}
          STAGING_BREVO_API_KEY: ${{ secrets.STAGING_BREVO_API_KEY }}
          STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          STAGING_GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_ALLOWED_HOSTS: ${{ secrets.STAGING_ALLOWED_HOSTS }}
          STAGING_CORS_ALLOWED_ORIGINS: ${{ secrets.STAGING_CORS_ALLOWED_ORIGINS }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 10m
          envs: STAGING_SECRET_KEY,STAGING_DB_NAME,STAGING_DB_USER,STAGING_DB_PASSWORD,STAGING_BRIQ_API_KEY,STAGING_BRIQ_APP_KEY,STAGING_BREVO_API_KEY,STAGING_ANTHROPIC_API_KEY,STAGING_GOOGLE_CLIENT_ID,STAGING_SUPABASE_URL,STAGING_SUPABASE_ANON_KEY,STAGING_ALLOWED_HOSTS,STAGING_CORS_ALLOWED_ORIGINS,STAGING_API_BASE_URL,GHCR_PULL_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            # Separate tree from production (/var/www/yrif) so a staging deploy cannot
            # check out this branch or retag images on the live site.
            if [ ! -d /var/www/yrif-staging/.git ]; then
              echo "Staging checkout missing at /var/www/yrif-staging."
              echo "Clone the repo there before enabling STAGING_SSH_HOST. Production is left untouched."
              exit 1
            fi
            cd /var/www/yrif-staging

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "--- Logging in to GHCR ---"
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            echo "--- Syncing env files ---"
            _uenv() {
              local k="$1" v="$2" f="$3"
              touch "$f"
              if grep -q "^${k}=" "$f" 2>/dev/null; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$f"
              else
                echo "${k}=${v}" >> "$f"
              fi
            }

            BE="backend/.env.production"
            ROOT=".env"
            _uenv SECRET_KEY           "$STAGING_SECRET_KEY" "$BE"
            _uenv DB_NAME              "$STAGING_DB_NAME" "$BE"
            _uenv DB_USER              "$STAGING_DB_USER" "$BE"
            _uenv DB_PASSWORD          "$STAGING_DB_PASSWORD" "$BE"
            _uenv DB_HOST              "db" "$BE"
            _uenv DB_PORT              "5432" "$BE"
            _uenv REDIS_URL            "redis://redis:6379/0" "$BE"
            _uenv BRIQ_API_KEY         "$STAGING_BRIQ_API_KEY" "$BE"
            _uenv BRIQ_APP_KEY         "$STAGING_BRIQ_APP_KEY" "$BE"
            _uenv BREVO_API_KEY        "$STAGING_BREVO_API_KEY" "$BE"
            _uenv ANTHROPIC_API_KEY    "$STAGING_ANTHROPIC_API_KEY" "$BE"
            _uenv GOOGLE_CLIENT_ID     "$STAGING_GOOGLE_CLIENT_ID" "$BE"
            _uenv SUPABASE_URL         "$STAGING_SUPABASE_URL" "$BE"
            _uenv SUPABASE_KEY         "$STAGING_SUPABASE_ANON_KEY" "$BE"
            _uenv ALLOWED_HOSTS        "$STAGING_ALLOWED_HOSTS" "$BE"
            _uenv CORS_ALLOWED_ORIGINS "$STAGING_CORS_ALLOWED_ORIGINS" "$BE"
            _uenv DEFAULT_FROM_EMAIL   "noreply@yriftz.org" "$BE"
            _uenv CONTACT_EMAIL        "info@yriftz.org" "$BE"

            _uenv DB_NAME              "$STAGING_DB_NAME" "$ROOT"
            _uenv DB_USER              "$STAGING_DB_USER" "$ROOT"
            _uenv DB_PASSWORD          "$STAGING_DB_PASSWORD" "$ROOT"
            _uenv VITE_SUPABASE_URL      "$STAGING_SUPABASE_URL" "$ROOT"
            _uenv VITE_SUPABASE_ANON_KEY "$STAGING_SUPABASE_ANON_KEY" "$ROOT"
            _uenv VITE_GOOGLE_CLIENT_ID  "$STAGING_GOOGLE_CLIENT_ID" "$ROOT"
            _uenv YRIF_IMAGE_TAG         "staging" "$ROOT"
            _uenv YRIF_HTTP_PORT         "3001" "$ROOT"

            echo "--- Pulling latest code ---"
            git pull origin staging
            echo "--- Pulling staging Docker images ---"
            export YRIF_IMAGE_TAG=staging
            export YRIF_HTTP_PORT=3001
            docker compose -f docker-compose.prod.yml -p yrif-staging pull
            echo "--- Restarting containers ---"
            docker compose -f docker-compose.prod.yml -p yrif-staging up -d --remove-orphans
            echo "--- Waiting for Gunicorn ---"
            ready=0
            for i in $(seq 1 24); do
              if docker exec yrif-staging-backend-1 python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()" 2>/dev/null; then
                echo "Gunicorn is listening"
                ready=1
                break
              fi
              echo "Waiting for Gunicorn ($i/24)..."
              sleep 5
            done
            if [ "$ready" != 1 ]; then
              echo "Gunicorn did not start listening on port 8000"
              docker logs --tail 80 yrif-staging-backend-1 || true
              exit 1
            fi
            echo "--- Running migrations ---"
            docker exec yrif-staging-backend-1 python manage.py migrate --no-input
            echo "--- Deploy complete ---"

      - name: Health check (staging)
        if: steps.check.outputs.healthcheck == 'true'
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "${{ secrets.STAGING_API_BASE_URL }}/health/")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging health check failed."
          exit 1

      - name: Notify on failure
        if: failure()
        run: echo "::error::Staging deploy FAILED for ${{ github.sha }} on ${{ github.ref_name }}"
